<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="todo-app">
      <h1>My To-Do List</h1>
      <form id="todo-form">
        <label for="todo-title">Item Name</label>
        <input id="todo-title" name="itemName" placeholder="Add an item..." required>
        <label for="todo-description">Item Description</label>
        <textarea id="todo-description" name="itemDescription" placeholder="Describe the item..." required></textarea>
        <button type="submit">Add</button>
      </form>
      <p id="message" role="status"></p>
      <ul id="todo-list"></ul>
    </main>
  </body>
</html>
